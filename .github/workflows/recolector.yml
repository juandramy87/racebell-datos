# Recolector diario en GitHub Actions: recoge las carreras, las publica en Cloudflare Pages (racebell-datos) y guarda
# en git las tablas que aprende. Necesita los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: Recolector diario
on:
  schedule:
    - cron: "15 5 * * *"   # 06:15 en Madrid en invierno (07:15 en verano)
  workflow_dispatch: {}
permissions:
  contents: write          # para guardar las tablas que el recolector recuerda (municipios, fichas vistas)
concurrency: recolector
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: recolector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recolector/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests de los lectores
        run: python -m pytest -q
      - name: Recoger carreras
        run: python recolectar.py --dias 400
      # Primero se publica (es lo que ve la app); guardar las tablas en git no debe impedirlo.
      - name: Publicar en Cloudflare Pages
        working-directory: .
        run: |
          mkdir -p sitio && cp recolector/datos/carreras.json publicar/_headers sitio/
          npx --yes wrangler@4 pages project list | grep -q racebell-datos || npx --yes wrangler@4 pages project create racebell-datos --production-branch main
          npx --yes wrangler@4 pages deploy sitio --project-name racebell-datos --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Guardar tablas aprendidas
        run: |
          git config user.name "racebell-bot"
          git config user.email "racebell-bot@users.noreply.github.com"
          git add datos/municipios.json datos/rockthesport-vistos.json datos/sportmaniacs-provincias.json datos/carreras.json datos/informe.json
          if ! git diff --cached --quiet; then
            git commit -m "Recolector: datos del $(date +%F)"
            # Si entretanto alguien ha subido código, se coloca encima y se reintenta.
            for i in 1 2 3; do git pull --rebase --autostash -q && git push && break; sleep 5; done
          fi
